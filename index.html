<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔧 Oficina - Sistema de Agendamentos</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* (mesmo CSS anterior - mantido igual) */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        :root { --primary: #6C63FF; --primary-dark: #5a52d5; --secondary: #FF6584; --success: #2ecc71; --warning: #f1c40f; --danger: #e74c3c; --bg: #f0f2f5; --card: #ffffff; --text: #2d3748; --text-light: #718096; --shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05); --shadow-hover: 0 20px 25px -5px rgba(0,0,0,0.15), 0 10px 10px -5px rgba(0,0,0,0.04); --radius: 16px; --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        nav { background: var(--card); box-shadow: var(--shadow); padding: 0.8rem 2rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; border-bottom: 3px solid transparent; background-image: linear-gradient(white, white), linear-gradient(to right, var(--primary), var(--secondary)); background-origin: padding-box, border-box; background-repeat: no-repeat; border-image: linear-gradient(to right, var(--primary), var(--secondary)) 1; border-bottom-style: solid; border-bottom-width: 3px; }
        nav .logo { font-weight: 800; font-size: 1.6rem; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -0.5px; }
        nav .logo i { -webkit-text-fill-color: initial; color: var(--primary); margin-right: 6px; }
        nav .nav-links { display: flex; flex-wrap: wrap; gap: 0.3rem; }
        nav .nav-links a { text-decoration: none; color: var(--text); font-weight: 500; padding: 0.5rem 1rem; border-radius: 30px; transition: var(--transition); font-size: 0.9rem; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        nav .nav-links a i { font-size: 0.9rem; opacity: 0.7; }
        nav .nav-links a:hover { background: rgba(108, 99, 255, 0.08); color: var(--primary); }
        nav .nav-links a.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(108, 99, 255, 0.4); }
        nav .nav-links a.active i { opacity: 1; }
        nav .user-area { display: flex; align-items: center; gap: 1rem; }
        nav .user-area select { padding: 0.4rem 1.2rem 0.4rem 1rem; border-radius: 30px; border: 2px solid #e2e8f0; background: white; font-weight: 500; cursor: pointer; transition: var(--transition); outline: none; font-size: 0.9rem; }
        nav .user-area select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2); }
        nav .user-area .user-icon { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 1rem; }
        .container { flex: 1; padding: 1.8rem 2rem; max-width: 1440px; margin: 0 auto; width: 100%; }
        .page { display: none; animation: fadeSlide 0.35s ease; }
        .page.active { display: block; }
        @keyframes fadeSlide { 0% { opacity: 0; transform: translateY(12px); } 100% { opacity: 1; transform: translateY(0); } }
        .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.5rem 1.8rem; margin-bottom: 1.8rem; transition: var(--transition); border: 1px solid rgba(226, 232, 240, 0.4); }
        .card:hover { box-shadow: var(--shadow-hover); }
        .card-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 1.2rem; }
        .card-header h2 { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .card-header h2 i { color: var(--primary); font-size: 1.5rem; }
        .btn { background: var(--primary); color: white; border: none; padding: 0.6rem 1.4rem; border-radius: 40px; font-weight: 600; cursor: pointer; transition: var(--transition); font-size: 0.9rem; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 8px rgba(108, 99, 255, 0.25); }
        .btn:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 8px 16px rgba(108, 99, 255, 0.35); }
        .btn:active { transform: translateY(0); }
        .btn-secondary { background: var(--secondary); box-shadow: 0 4px 8px rgba(255, 101, 132, 0.3); }
        .btn-secondary:hover { background: #e55572; box-shadow: 0 8px 16px rgba(255, 101, 132, 0.4); }
        .btn-success { background: var(--success); box-shadow: 0 4px 8px rgba(46, 204, 113, 0.3); }
        .btn-success:hover { background: #27ae60; box-shadow: 0 8px 16px rgba(46, 204, 113, 0.4); }
        .btn-danger { background: var(--danger); box-shadow: 0 4px 8px rgba(231, 76, 60, 0.3); }
        .btn-danger:hover { background: #c0392b; box-shadow: 0 8px 16px rgba(231, 76, 60, 0.4); }
        .btn-warning { background: var(--warning); color: #2d3748; box-shadow: 0 4px 8px rgba(241, 196, 15, 0.3); }
        .btn-warning:hover { background: #f39c12; box-shadow: 0 8px 16px rgba(241, 196, 15, 0.4); }
        .btn-sm { padding: 0.3rem 0.9rem; font-size: 0.8rem; gap: 4px; }
        .table-responsive { overflow-x: auto; border-radius: 12px; }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafbff; }
        .status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 0.2rem 0.9rem; border-radius: 40px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
        .status-badge i { font-size: 0.6rem; }
        .status-pendente { background: #fef3c7; color: #92400e; }
        .status-confirmado { background: #dbeafe; color: #1e3a8a; }
        .status-em_andamento { background: #fde68a; color: #78350f; }
        .status-concluido { background: #d1fae5; color: #065f46; }
        .status-cancelado { background: #fee2e2; color: #7f1d1d; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.3rem; font-size: 0.85rem; color: var(--text-light); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.6rem 1rem; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 0.95rem; background: white; transition: var(--transition); outline: none; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.15); }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.2rem; }
        .filtros-row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; }
        .filtros-row .form-group { flex: 1 1 150px; margin-bottom: 0; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; animation: fadeIn 0.25s; }
        .modal-overlay.active { display: flex; }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        .modal { background: white; border-radius: var(--radius); max-width: 640px; width: 92%; max-height: 92vh; overflow-y: auto; padding: 2rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); animation: slideUp 0.3s ease; }
        @keyframes slideUp { 0% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        .modal h3 { font-size: 1.5rem; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .modal h3 i { color: var(--primary); }
        .modal .close-btn { float: right; background: none; border: none; font-size: 2rem; cursor: pointer; color: #a0aec0; transition: var(--transition); line-height: 1; }
        .modal .close-btn:hover { color: var(--text); transform: rotate(90deg); }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: var(--card); padding: 1.2rem 1.5rem; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; transition: var(--transition); border-left: 5px solid var(--primary); position: relative; overflow: hidden; }
        .stat-card::after { content: ''; position: absolute; top: -50%; right: -50%; width: 100%; height: 100%; background: radial-gradient(circle, rgba(108,99,255,0.04) 0%, transparent 70%); pointer-events: none; }
        .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
        .stat-card .number { font-size: 2.4rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .stat-card .label { color: var(--text-light); font-size: 0.85rem; font-weight: 500; margin-top: 2px; }
        .stat-card .icon { font-size: 2rem; opacity: 0.15; position: absolute; right: 12px; bottom: 12px; }
        .stat-card:nth-child(2) { border-left-color: var(--secondary); }
        .stat-card:nth-child(3) { border-left-color: var(--warning); }
        .chart-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1.8rem; }
        .chart-box { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.2rem; transition: var(--transition); border: 1px solid rgba(226, 232, 240, 0.4); }
        .chart-box:hover { box-shadow: var(--shadow-hover); }
        .chart-box canvas { max-height: 240px; width: 100% !important; }
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; max-width: 350px; width: 100%; }
        .toast { background: #2d3748; color: white; padding: 0.8rem 1.2rem; border-radius: 12px; box-shadow: var(--shadow-hover); display: flex; align-items: center; gap: 10px; animation: slideInToast 0.4s ease; transition: var(--transition); }
        .toast.success { border-left: 5px solid var(--success); }
        .toast.error { border-left: 5px solid var(--danger); }
        .toast.warning { border-left: 5px solid var(--warning); }
        .toast i { font-size: 1.2rem; }
        .toast .toast-close { margin-left: auto; background: none; border: none; color: white; cursor: pointer; font-size: 1.2rem; opacity: 0.6; transition: var(--transition); }
        .toast .toast-close:hover { opacity: 1; }
        @keyframes slideInToast { 0% { transform: translateX(100%); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
        #calendar { max-width: 1100px; margin: 0 auto; }
        .fc-event-title { font-weight: 600; }
        .fc-daygrid-event { border-radius: 4px; }
        @media print { body * { visibility: hidden; } #print-area, #print-area * { visibility: visible; } #print-area { position: absolute; left: 0; top: 0; width: 100%; padding: 2rem; background: white; } .no-print { display: none !important; } }
        .text-muted { color: var(--text-light); font-size: 0.85rem; }
        .flex { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
        .mt-2 { margin-top: 1rem; }
        .mb-1 { margin-bottom: 0.5rem; }
        @media (max-width: 768px) { nav { flex-direction: column; align-items: stretch; gap: 0.6rem; padding: 0.8rem 1rem; } nav .nav-links { justify-content: center; gap: 0.2rem; } nav .nav-links a { font-size: 0.8rem; padding: 0.4rem 0.7rem; } nav .user-area { justify-content: center; } .container { padding: 1rem; } .form-row { grid-template-columns: 1fr; } .modal { padding: 1.5rem; } .dashboard-grid { grid-template-columns: repeat(2, 1fr); } .chart-container { grid-template-columns: 1fr; } .stat-card .number { font-size: 1.8rem; } .filtros-row { flex-direction: column; } .filtros-row .form-group { flex: 1 1 100%; } }
        @media (max-width: 480px) { .dashboard-grid { grid-template-columns: 1fr; } .card-header h2 { font-size: 1.1rem; } }
    </style>
</head>

<!-- NAVEGAÇÃO (idêntica) -->
<nav>

<!-- CONTEÚDO (idêntico) -->
<div class="container">
    <!-- (mesmo conteúdo HTML das páginas, modais etc.) -->
    <!-- Mantive exatamente igual ao seu arquivo, por isso omiti aqui para não repetir todo o HTML -->

<!-- ============================================================ -->
<script>
// ============================================================
// DATA STORE
// ============================================================
const DB = {
    get(key, defaultVal = []) {
        try {
            const data = localStorage.getItem('oficina_' + key);
            return data ? JSON.parse(data) : defaultVal;
        } catch { return defaultVal; }
    },
    set(key, value) {
        localStorage.setItem('oficina_' + key, JSON.stringify(value));
    },
    clientes: { get: () => DB.get('clientes'), set: (v) => DB.set('clientes', v) },
    veiculos: { get: () => DB.get('veiculos'), set: (v) => DB.set('veiculos', v) },
    mecanicos: { get: () => DB.get('mecanicos'), set: (v) => DB.set('mecanicos', v) },
    servicos: { get: () => DB.get('servicos'), set: (v) => DB.set('servicos', v) },
    agendamentos: { get: () => DB.get('agendamentos'), set: (v) => DB.set('agendamentos', v) },
    lembretes: { get: () => DB.get('lembretes'), set: (v) => DB.set('lembretes', v) },
};

// ============================================================
// DADOS INICIAIS (mesmo)
// ============================================================
function initDados() {
    if (DB.clientes.get().length === 0) {
        DB.clientes.set([
            { id: 1, nome: 'João Silva', telefone: '(11) 99999-9999', email: 'joao@email.com', endereco: 'Rua A, 123' },
            { id: 2, nome: 'Maria Souza', telefone: '(21) 98888-8888', email: 'maria@email.com', endereco: 'Av B, 456' },
        ]);
    }
    if (DB.veiculos.get().length === 0) {
        DB.veiculos.set([
            { id: 1, placa: 'ABC1234', modelo: 'Civic', marca: 'Honda', ano: 2020, cor: 'Prata', km: 15000, clienteId: 1, obs: '' },
            { id: 2, placa: 'XYZ5678', modelo: 'Gol', marca: 'VW', ano: 2018, cor: 'Branco', km: 45000, clienteId: 2, obs: '' },
        ]);
    }
    if (DB.mecanicos.get().length === 0) {
        DB.mecanicos.set([
            { id: 1, nome: 'Carlos Mecânico', especialidade: 'Motor', telefone: '(11) 97777-7777', email: 'carlos@oficina.com' },
            { id: 2, nome: 'Ana Ferraz', especialidade: 'Freios/Suspensão', telefone: '(11) 96666-6666', email: 'ana@oficina.com' },
            { id: 3, nome: 'Roberto Alves', especialidade: 'Elétrica', telefone: '(11) 95555-5555', email: 'roberto@oficina.com' },
        ]);
    }
    if (DB.servicos.get().length === 0) {
        DB.servicos.set([
            { id: 1, nome: 'Troca de Óleo', descricao: 'Óleo e filtro', preco: 120.00, duracao: 30 },
            { id: 2, nome: 'Alinhamento e Balanceamento', descricao: '', preco: 80.00, duracao: 45 },
            { id: 3, nome: 'Revisão de Freios', descricao: 'Pastilhas e discos', preco: 200.00, duracao: 60 },
            { id: 4, nome: 'Troca de Bateria', descricao: '', preco: 150.00, duracao: 20 },
        ]);
    }
    if (DB.agendamentos.get().length === 0) {
        const now = new Date();
        const hoje = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 10, 0);
        const amanha = new Date(hoje);
        amanha.setDate(amanha.getDate() + 1);
        DB.agendamentos.set([
            { id: 1, clienteId: 1, veiculoId: 1, mecanicoId: 1, dataHora: hoje.toISOString(), status: 'confirmado', observacoes: '', servicos: [1,2] },
            { id: 2, clienteId: 2, veiculoId: 2, mecanicoId: 2, dataHora: amanha.toISOString(), status: 'pendente', observacoes: 'Cliente pediu para verificar barulho', servicos: [3] },
        ]);
    }
    if (DB.lembretes.get().length === 0) {
        DB.lembretes.set([
            { id: 1, agendamentoId: 1, tipo: 'email', enviadoEm: new Date().toISOString(), status: 'enviado' },
        ]);
    }
}
initDados();

// ============================================================
// HELPERS (mesmo)
// ============================================================
function gerarId(lista) {
    return lista.length ? Math.max(...lista.map(i => i.id || 0)) + 1 : 1;
}
function findById(lista, id) { return lista.find(i => i.id === id); }
function formatDate(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function formatDateShort(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function getStatusLabel(st) {
    const map = { pendente: 'Pendente', confirmado: 'Confirmado', em_andamento: 'Em andamento', concluido: 'Concluído', cancelado: 'Cancelado' };
    return map[st] || st;
}
function getStatusClass(st) {
    return 'status-' + st.replace('_', '');
}
function getStatusColor(st) {
    const map = { pendente: '#fcd34d', confirmado: '#93c5fd', em_andamento: '#f59e0b', concluido: '#6ee7b7', cancelado: '#fca5a5' };
    return map[st] || '#ccc';
}
function getNomeCliente(id) {
    const c = findById(DB.clientes.get(), id);
    return c ? c.nome : 'N/A';
}
function getNomeMecanico(id) {
    const m = findById(DB.mecanicos.get(), id);
    return m ? m.nome : 'N/A';
}
function getNomeServico(id) {
    const s = findById(DB.servicos.get(), id);
    return s ? s.nome : 'N/A';
}
function getVeiculoInfo(id) {
    const v = findById(DB.veiculos.get(), id);
    return v ? v.placa + ' (' + v.modelo + ')' : 'N/A';
}
function getDuracaoServicos(ids) {
    let total = 0;
    (ids || []).forEach(id => {
        const s = findById(DB.servicos.get(), id);
        if (s && s.duracao) total += s.duracao;
    });
    return total;
}

// ============================================================
// TOASTS
// ============================================================
function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-exclamation-triangle';
    toast.innerHTML = `<i class="fas ${icon}"></i> <span>${message}</span> <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>`;
    container.appendChild(toast);
    setTimeout(() => { if (toast.parentElement) toast.remove(); }, 4000);
}

// ============================================================
// NAVEGAÇÃO, MODAIS, DASHBOARD, FILTROS etc. (idênticos)
// ============================================================
// ... (mantive todo o resto igual, inclusive as funções de preenchimento antigas)
// Mas vou substituir as funções críticas por versões melhoradas.

// ============================================================
// FUNÇÕES DE PREENCHIMENTO CORRIGIDAS
// ============================================================
function preencherSelectClientes(selectId) {
    const sel = document.getElementById(selectId);
    const clientes = DB.clientes.get();
    sel.innerHTML = '<option value="">Selecione</option>' +
        clientes.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');
}

function preencherSelectVeiculos(selectId, selectedId = null) {
    const sel = document.getElementById(selectId);
    const veiculos = DB.veiculos.get();
    let html = '<option value="">Selecione</option>';
    let found = false;

    // Converte selectedId para número para comparação
    const selectedNum = selectedId !== null ? Number(selectedId) : null;
    const selectedStr = selectedNum !== null ? String(selectedNum) : null;

    veiculos.forEach(v => {
        const val = v.id || 0;
        html += `<option value="${val}">${v.placa} - ${v.modelo}</option>`;
        if (val === selectedNum) found = true;
    });

    // Se não encontrou e temos um ID válido, cria uma opção temporária
    if (selectedNum !== null && !isNaN(selectedNum) && !found) {
        const veiculo = findById(DB.veiculos.get(), selectedNum);
        const label = veiculo ? `${veiculo.placa} - ${veiculo.modelo}` : `Veículo #${selectedNum}`;
        html += `<option value="${selectedNum}" selected>${label}</option>`;
        found = true; // marcamos como encontrado para selecionar depois
    }

    sel.innerHTML = html;

    // Seleciona o valor se encontrou ou se foi fornecido
    if (selectedNum !== null && !isNaN(selectedNum)) {
        sel.value = selectedStr;
        // Se ainda não selecionou, percorre as opções
        if (sel.value !== selectedStr) {
            for (let opt of sel.options) {
                if (opt.value === selectedStr) {
                    opt.selected = true;
                    break;
                }
            }
        }
    }

    console.log('preencherSelectVeiculos - selectedId:', selectedId, 'selectedNum:', selectedNum, 'selectedStr:', selectedStr, 'found:', found, 'html gerado:', html);
}

function preencherSelectMecanicos(selectId) {
    const sel = document.getElementById(selectId);
    const mecanicos = DB.mecanicos.get();
    sel.innerHTML = '<option value="">Selecione</option>' +
        mecanicos.map(m => `<option value="${m.id}">${m.nome}</option>`).join('');
}

function preencherSelectServicosMulti(selectId) {
    const sel = document.getElementById(selectId);
    const servicos = DB.servicos.get();
    sel.innerHTML = servicos.map(s => `<option value="${s.id}">${s.nome} (R$ ${s.preco?.toFixed(2)})</option>`).join('');
}

// ============================================================
// ABRIR MODAL (com verificação extra)
// ============================================================
function abrirModalAgendamento(data) {
    document.getElementById('formAgendamento').reset();
    document.getElementById('agendamentoId').value = '';
    document.getElementById('modalAgendamentoTitulo').textContent = 'Novo Agendamento';

    preencherSelectClientes('agCliente');
    preencherSelectVeiculos('agVeiculo'); // sem seleção
    preencherSelectMecanicos('agMecanico');
    preencherSelectServicosMulti('agServicos');

    if (data) {
        document.getElementById('modalAgendamentoTitulo').textContent = 'Editar Agendamento';
        document.getElementById('agendamentoId').value = data.id;

        // Verifica se veiculoId existe e é válido
        const veiculoId = data.veiculoId;
        console.log('Editando agendamento - veiculoId recebido:', veiculoId, 'tipo:', typeof veiculoId);

        // Recarrega os selects com os IDs
        preencherSelectClientes('agCliente');
        preencherSelectVeiculos('agVeiculo', veiculoId);
        preencherSelectMecanicos('agMecanico');

        // Define os valores
        document.getElementById('agCliente').value = data.clienteId;
        document.getElementById('agMecanico').value = data.mecanicoId || '';
        document.getElementById('agDataHora').value = data.dataHora ? data.dataHora.slice(0,16) : '';
        document.getElementById('agStatus').value = data.status || 'pendente';
        document.getElementById('agObservacoes').value = data.observacoes || '';

        const servSelect = document.getElementById('agServicos');
        for (let opt of servSelect.options) {
            opt.selected = (data.servicos || []).includes(Number(opt.value));
        }

        // Log do valor final do select
        console.log('Valor final do select veículo:', document.getElementById('agVeiculo').value);
    } else {
        document.getElementById('agStatus').value = 'pendente';
        const now = new Date();
        now.setHours(now.getHours() + 1);
        document.getElementById('agDataHora').value = now.toISOString().slice(0,16);
    }
    abrirModal('modalAgendamento');
}

// ============================================================
// SALVAR AGENDAMENTO (com validação reforçada)
// ============================================================
function salvarAgendamento(e) {
    e.preventDefault();

    const clienteSelect = document.getElementById('agCliente');
    const veiculoSelect = document.getElementById('agVeiculo');
    const mecanicoSelect = document.getElementById('agMecanico');
    const dataInput = document.getElementById('agDataHora');
    const statusSelect = document.getElementById('agStatus');
    const obsText = document.getElementById('agObservacoes');
    const servicosSelect = document.getElementById('agServicos');

    const clienteVal = clienteSelect.value;
    const veiculoVal = veiculoSelect.value;
    const mecanicoVal = mecanicoSelect.value;
    const dataHora = dataInput.value;

    const clienteId = Number(clienteVal);
    const veiculoId = Number(veiculoVal);
    const mecanicoId = Number(mecanicoVal);

    console.log('Salvando - Cliente:', clienteVal, '->', clienteId);
    console.log('Salvando - Veículo:', veiculoVal, '->', veiculoId);
    console.log('Salvando - Mecânico:', mecanicoVal, '->', mecanicoId);
    console.log('Salvando - Data/Hora:', dataHora);

    // --- VALIDAÇÕES EXPLÍCITAS ---
    if (!clienteVal || isNaN(clienteId) || clienteId <= 0) {
        showToast('Selecione um cliente válido.', 'error');
        return;
    }
    if (!veiculoVal || isNaN(veiculoId) || veiculoId <= 0) {
        // Tenta recuperar o veículo pelo ID (caso seja 0 ou vazio)
        if (veiculoVal && veiculoVal !== '') {
            const veiculo = findById(DB.veiculos.get(), Number(veiculoVal));
            if (veiculo) {
                console.log('Veículo recuperado pelo ID:', veiculo);
                // Prossegue, pois o veículo existe
            } else {
                showToast('Veículo não encontrado. Selecione um veículo válido.', 'error');
                return;
            }
        } else {
            showToast('Selecione um veículo válido (ID: ' + veiculoVal + ').', 'error');
            return;
        }
    }
    if (!dataHora || dataHora === '') {
        showToast('Preencha a data e hora.', 'error');
        return;
    }

    if (!validarDataHora(dataHora)) return;

    const mecanicoFinal = (mecanicoVal && !isNaN(mecanicoId) && mecanicoId > 0) ? mecanicoId : null;
    const status = statusSelect.value;
    const observacoes = obsText.value;
    const servicos = Array.from(servicosSelect.selectedOptions).map(o => Number(o.value));

    if (mecanicoFinal) {
        const duracao = getDuracaoServicos(servicos) || 30;
        const idEdicao = document.getElementById('agendamentoId').value;
        const conflito = verificarConflito(mecanicoFinal, dataHora, duracao, idEdicao ? Number(idEdicao) : null);
        if (conflito) {
            showToast('Conflito de horário! Este mecânico já possui um agendamento nesse período.', 'error');
            return;
        }
    }

    const ags = DB.agendamentos.get();
    const id = document.getElementById('agendamentoId').value;

    if (id) {
        const idx = ags.findIndex(a => a.id === Number(id));
        if (idx !== -1) {
            ags[idx] = {
                ...ags[idx],
                clienteId,
                veiculoId,
                mecanicoId: mecanicoFinal,
                dataHora,
                status,
                observacoes,
                servicos
            };
            showToast('Agendamento atualizado com sucesso!', 'success');
        } else {
            showToast('Agendamento não encontrado para edição.', 'error');
            return;
        }
    } else {
        const novo = {
            id: gerarId(ags),
            clienteId,
            veiculoId,
            mecanicoId: mecanicoFinal,
            dataHora,
            status,
            observacoes,
            servicos
        };
        ags.push(novo);
        if (status !== 'cancelado') agendarLembrete(novo.id);
        showToast('Agendamento criado com sucesso!', 'success');
    }
    DB.agendamentos.set(ags);
    fecharModal('modalAgendamento');
    aplicarFiltros();
    atualizarDashboard();
    if (calendarInstance) renderizarCalendario();
}
